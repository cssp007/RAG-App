name: Build and Deploy RAG App

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKER_IMAGE: cssp007143/rag-app

jobs:

  build:
    name: Build, Push and Update GitOps
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout application source code
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # 2. Setup Docker Buildx
      # --------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------
      # 3. Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------
      # 4. Generate Docker image metadata
      # --------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest


      # --------------------------------------------------
      # 5. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false

          tags: |
            ${{ steps.meta.outputs.tags }}

          labels: |
            ${{ steps.meta.outputs.labels }}

          # GitHub Actions Docker cache
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # --------------------------------------------------
      # 6. Save Docker image as artifact
      # --------------------------------------------------
      - name: Save Docker image
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest || true

          docker save \
            ${{ env.DOCKER_IMAGE }}:latest \
            -o rag-app.tar


      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-app-docker-image
          path: rag-app.tar
          retention-days: 1


      # --------------------------------------------------
      # 7. Build and Push Docker image to Docker Hub
      # --------------------------------------------------
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}

          labels: |
            ${{ steps.meta.outputs.labels }}

          # Docker layer cache
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # --------------------------------------------------
      # 8. Display image information
      # --------------------------------------------------
      - name: Display Docker image
        run: |
          echo "Docker image pushed successfully:"
          echo "${{ env.DOCKER_IMAGE }}:latest"
          echo "${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}"


      # --------------------------------------------------
      # 9. Checkout GitOps repository
      # --------------------------------------------------
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: cssp007/gitops-repo
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops


      # --------------------------------------------------
      # 10. Update image tag in GitOps repository
      # --------------------------------------------------
      - name: Update image tag
        working-directory: gitops
        run: |

          IMAGE_TAG="sha-${GITHUB_SHA}"

          echo "Updating image to:"
          echo "${DOCKER_IMAGE}:${IMAGE_TAG}"

          sed -i \
            "s|image: docker.io/cssp007143/rag-app:.*|image: docker.io/cssp007143/rag-app:${IMAGE_TAG}|" \
            apps/rag-app/deployment.yaml


      # --------------------------------------------------
      # 11. Commit GitOps change
      # --------------------------------------------------
      - name: Commit GitOps changes
        working-directory: gitops
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/rag-app/deployment.yaml

          git commit \
            -m "Update rag-app image to sha-${GITHUB_SHA}" \
            || echo "No changes to commit"


      # --------------------------------------------------
      # 12. Push GitOps changes
      # --------------------------------------------------
      - name: Push GitOps changes
        working-directory: gitops
        run: |
          git push
name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the exact commit that triggered the workflow
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Generate Docker metadata
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      # 5. Build Docker image with cache
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Docker layer cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Save Docker image as artifact
      - name: Save Docker image
        run: |
          docker save \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -o python-app.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-docker-image
          path: python-app.tar
          retention-days: 7

      # 7. Push image to registry
      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Output image information
      - name: Image information
        run: |
          echo "Image:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "Commit SHA:"
          echo "${{ github.sha }}"
